<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Page not found · Sprout</title>
<meta name="robots" content="noindex, follow">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#7C4DFF">
<link rel="icon" type="image/svg+xml" href="/assets/logo.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/styles.css">
</head>
<body>

<header class="site-header">
  <div class="wrap">
    <nav class="nav" id="nav">
      <a class="brand" href="/"><img class="logo" src="/assets/logo.svg" alt="Sprout logo"> Sprout</a>
      <div class="nav-cta">
        <a href="/" class="btn btn-dark">Back home</a>
      </div>
    </nav>
  </div>
</header>

<main class="notfound">
  <div class="wrap narrow">
    <div class="big">404</div>
    <h1 style="font-size:28px;letter-spacing:-.6px;margin:8px 0 10px;">This page didn't sprout 🌱</h1>
    <p style="color:var(--muted);font-size:18px;max-width:460px;margin:0 auto 28px;">The page you're looking for doesn't exist or may have moved. Let's get you back on track.</p>
    <div class="hero-actions" style="justify-content:center;">
      <a href="/" class="btn btn-dark btn-lg">Go to homepage</a>
      <a href="/support" class="btn btn-light btn-lg">Contact support</a>
    </div>
  </div>
</main>

<footer class="site-footer">
  <div class="wrap">
    <div class="footer-bottom" style="border:0;margin:0;padding:0;justify-content:center;">
      <span>© 2026 Sprout · <a href="/privacy">Privacy</a> · <a href="/terms">Terms</a> · <a href="/delete-account">Delete account</a></span>
    </div>
  </div>
</footer>
</body>
</html>
