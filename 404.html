<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script>
(function(){
  try{
    var t = localStorage.getItem('theme') || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    document.documentElement.setAttribute('data-theme', t);
  }catch(e){}
  function wire(){
    var btn = document.getElementById('themeToggle');
    if(!btn) return;
    btn.addEventListener('click', function(){
      var cur = document.documentElement.getAttribute('data-theme') === 'dark' ? 'dark' : 'light';
      var next = cur === 'dark' ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', next);
      try{ localStorage.setItem('theme', next); }catch(e){}
      var m = document.querySelector('meta[name="theme-color"]');
      if(m) m.setAttribute('content', next === 'dark' ? '#0b0b0f' : '#ffffff');
    });
  }
  if(document.readyState === 'loading'){ document.addEventListener('DOMContentLoaded', wire); } else { wire(); }
})();
</script>
<title>Page not found · Sprout</title>
<meta name="robots" content="noindex, follow">
<meta name="theme-color" content="#7C4DFF">
<link rel="icon" type="image/svg+xml" href="/assets/logo.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/styles.css">
</head>
<body>

<header class="site-header">
  <div class="wrap">
    <nav class="nav" id="nav">
      <a class="brand" href="/"><img class="logo" src="/assets/logo.svg" alt="Sprout logo"> Sprout</a>
      <div class="nav-cta">
        <button class="theme-toggle" id="themeToggle" type="button" aria-label="Toggle dark mode" title="Toggle theme">
          <svg class="ico-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
          <svg class="ico-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        </button>
        <a href="/" class="btn btn-dark">Back home</a>
      </div>
    </nav>
  </div>
</header>

<main class="notfound">
  <div class="wrap narrow">
    <div class="big">404</div>
    <h1 style="font-size:28px;letter-spacing:-.6px;margin:8px 0 10px;">This page didn't sprout 🌱</h1>
    <p style="color:var(--muted);font-size:18px;max-width:460px;margin:0 auto 28px;">The page you're looking for doesn't exist or may have moved. Let's get you back on track.</p>
    <div class="hero-actions" style="justify-content:center;">
      <a href="/" class="btn btn-dark btn-lg">Go to homepage</a>
      <a href="/support" class="btn btn-light btn-lg">Contact support</a>
    </div>
  </div>
</main>

<footer class="site-footer">
  <div class="wrap">
    <div class="footer-bottom" style="border:0;margin:0;padding:0;justify-content:center;">
      <span>© 2026 Sprout · <a href="/privacy">Privacy</a> · <a href="/terms">Terms</a> · <a href="/delete-account">Delete account</a></span>
    </div>
  </div>
</footer>
</body>
</html>
